name: Forecast check (temporary)
on:
  pull_request:
    paths: ['analysis/**', '.github/workflows/forecast-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node analysis/forecast-check.mjs
