name: Port Nelson Harbor Scraper

# This section controls what triggers the script
on:
  workflow_dispatch: # Opens the front door for your Cron-Job.org webhook pings
  push:
    branches:
      - main # Optional: Still runs automatically if you push code updates to main

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the latest code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up a clean Python environment on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution by caching your libraries

      # 3. Install required libraries (pandas, requests, google-genai, supabase, etc.)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Execute your scraping script
      # Note: This injects your encrypted GitHub Secrets into the script as environment variables
      - name: Run Weather Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python your_scraper_script.py 
