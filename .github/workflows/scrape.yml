name: Port Nelson Harbor Scraper
concurrency:
  group: scraper-group
  cancel-in-progress: true
on:
  workflow_dispatch: # Allows Cron-Job.org to trigger the script via API every 5 minutes
  push:
    branches:
      - main # Automatically runs if you manually push code updates to main

# Lets the alert step below read past runs and open or close an issue.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the latest code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up a clean Python environment on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution by caching your libraries

      # 3. Install required libraries from your requirements text file
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Execute the scraper script using your environment secrets
      - name: Run Weather Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      # 5. Email when a station on the Port Nelson image has been faulty for an hour.
      # Opens one "Station fault: <station>" issue (GitHub emails it) with a note
      # to send to Port Nelson, and closes it when the station reads again.
      - name: Alert if a station has been faulty for an hour
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTIFY: alistermorison
          ALERT_FRAMES: 12      # frames in a row with no reading (12 = about 1 hour)
        run: python station_alert.py

      # 6. Alert only when the scraper keeps failing.
      # A single failure is normal (Gemini is sometimes busy), so nothing happens.
      # When the last ALERT_AFTER runs have ALL failed, open one GitHub issue
      # titled "Scraper down", which GitHub emails to you. While that issue is
      # open no more alerts are sent. The next successful run comments
      # "working again" on the issue and closes it.
      - name: Alert if several runs in a row have failed
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          ALERT_AFTER: 6        # failures in a row before an alert (6 = about 30 minutes)
          WITHIN_MINUTES: 45    # ...and they must all be within this many minutes
          NOTIFY: alistermorison
        run: |
          open_issue=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null and (.title | startswith("Scraper down")))][0].number // empty')
          now=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$open_issue" ]; then
              gh api "repos/$REPO/issues/$open_issue/comments" -f body="Working again: run $RUN_ID succeeded at $now. Closing this alert." >/dev/null
              gh api -X PATCH "repos/$REPO/issues/$open_issue" -f state=closed >/dev/null
              echo "Scraper recovered, closed alert #$open_issue"
            fi
            exit 0
          fi
          [ "$OUTCOME" = "failure" ] || exit 0

          if [ -n "$open_issue" ]; then
            echo "Alert #$open_issue is already open, not sending another"
            exit 0
          fi

          # This run counts as one failure; look at the previous finished runs
          # (skipping cancelled ones) to see if they failed too.
          need=$((ALERT_AFTER - 1))
          since=$(date -u -d "-$WITHIN_MINUTES minutes" +%s)
          all_failed=$(gh api "repos/$REPO/actions/workflows/scrape.yml/runs?branch=main&status=completed&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .conclusion != \"cancelled\")][:$need]
                  | length == $need and all(.conclusion == \"failure\" and (.created_at | fromdate) >= $since)")
          echo "Previous $need runs all failed within $WITHIN_MINUTES minutes: $all_failed"
          [ "$all_failed" = "true" ] || exit 0

          body="@$NOTIFY the Port Nelson scraper has failed $ALERT_AFTER times in a row (latest at $now), so AWACalc's harbour data is not updating.

          Latest failed run: https://github.com/$REPO/actions/runs/$RUN_ID
          All runs: https://github.com/$REPO/actions/workflows/scrape.yml

          This issue closes itself, with a comment, as soon as a run succeeds again."
          gh api "repos/$REPO/issues" -f title="Scraper down: $ALERT_AFTER failed runs in a row" -f body="$(echo "$body" | sed 's/^ *//')" --jq '"Opened alert #\(.number)"'
